[project]
name = "mqtt-python-script"
version = "0.1.3"
description = "Fail-closed MQTT and atomic SFTP command-line adapters"
readme = "README.md"
requires-python = "==3.13.16"
dependencies = [
  "amqtt==0.12.1",
  "paho-mqtt==2.1.0",
  "paramiko==5.0.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
